name: CI

on: [push, pull_request]

jobs:
  # Everything that needs no credentials. The unit suite supplies its own dummy Sanity
  # vars (see vitest.config.mts) and is forbidden from touching the network, so this job
  # runs identically for an outside contributor's fork, where secrets are unavailable.
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck runs first on purpose, so a type error fails fast. This is also why
      # route props are typed explicitly rather than with Next's generated globals —
      # those only exist after a build has produced .next/types.
      - run: npx tsc --noEmit
      # ESLint carries the logical-properties rule, which is what decides whether Phase 2
      # (Hebrew/RTL) is additive or a rewrite. It is not optional styling enforcement.
      - run: npx eslint .
      - run: npm test

  # The build prerenders every route, which means it reaches Sanity — so this job needs
  # credentials and cannot run on a fork PR, where GitHub withholds secrets. Guarded
  # rather than left to fail: a red X an outside contributor cannot act on is noise.
  build:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      # Required, not optional: the dataset is private. Without this the build fails on
      # a missing siteSettings document — an error that names the content, not the
      # credential, and sends you looking in the wrong place entirely.
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail here, with a clear message, rather than inside a Playwright webServer
      # timeout — playwright.config.ts builds before it serves, so without this step a
      # broken build reports as "server never came up".
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Lighthouse budget
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://localhost:3000/
          budgetPath: ./lighthouse-budget.json
          startServerCommand: npm start
          # The 800KB image budget is the guardrail against the old site's central
          # failure: 10-20MB camera originals. It fails the build long before anyone
          # ships one.
# Note: `npm test` runs only tests/unit. The content-integrity suite
# (`npm run test:content`) reads the live dataset and is run deliberately before a
# content release, not on every push — see content-gate.yml.
